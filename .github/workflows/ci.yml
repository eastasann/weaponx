name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make e2e
      - run: make build
      - name: tokens.css に差分が無いこと
        run: |
          make tokens
          git diff --exit-code -- apps/web/src/styles/tokens.css
      - name: Terraform の構文
        run: make tf-validate
      - name: Playwright のレポート
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
