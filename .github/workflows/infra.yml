name: infra

# infra/ の変更。PR では plan をコメントし、main へのマージで apply する(ADR-022)。
# plan は読み取りだけのサービスアカウント(state に書けないので -lock=false)、
# apply は main のワークフローだけが使えるサービスアカウント
on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.13.3"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init・fmt・validate
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
          terraform fmt -check -recursive
          terraform validate
      - name: plan
        working-directory: infra
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color -var-file=environments/production.tfvars | tee ../plan.txt
      - name: PR にコメント
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            let plan = fs.existsSync("plan.txt") ? fs.readFileSync("plan.txt", "utf8") : "plan が実行されませんでした。ワークフローのログを確認してください";
            if (plan.length > 60000) plan = plan.slice(0, 60000) + "\n...(省略。全文はワークフローのログ)";
            const body = `${marker}\n### terraform plan\n\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: apply
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
          terraform apply -input=false -auto-approve -var-file=environments/production.tfvars
